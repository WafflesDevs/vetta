[project]
name = "vetta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.3.0",
    "langchain-core>=1.5.2",
    "langgraph>=1.2.10",
    "langsmith>=0.10.11",
    "pillow>=12.3.0",
    "psycopg2>=2.9.12",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "stripe>=12.0.0",
    "supabase>=2.31.0",
    "tavily>=1.1.0",
    "tavily-python>=0.7.26",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
