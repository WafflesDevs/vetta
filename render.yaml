# One free web service: FastAPI serves the built React app.
services:
  - type: web
    name: vetta
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -e . && cd frontend && npm install && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20"
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: vetta
      - key: JOBS_USE_APIFY
        value: "false"
      - key: MAX_CHATS
        value: "2"
      - key: MAX_MESSAGES_PER_CHAT
        value: "30"
      - key: JOBS_MAX_ITEMS
        value: "10"
      - key: JOBS_CACHE_TTL_SECONDS
        value: "3600"
      - key: JOBS_REFRESH_COOLDOWN_SECONDS
        value: "3600"
      - key: QUIZ_MAX_CYCLES_PER_HOUR
        value: "2"
      - key: QUIZ_CYCLE_WINDOW_SECONDS
        value: "3600"
      - key: QUIZ_QUESTIONS_PER_CYCLE
        value: "5"
      # Cheapest Claude Haiku for all AI features (chat, quiz, resume, tools, scores)
      - key: AI_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      # Stripe optional — paid plans TBA (billing disabled in app)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRODUCT_EXPERT
        sync: false
      - key: STRIPE_PRODUCT_PRO
        sync: false
      - key: STRIPE_PRICE_EXPERT
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: APP_URL
        sync: false
      - key: PASSWORD_RESET_REDIRECT_URL
        sync: false
